services:
  db:
    image: postgres:16-alpine
    container_name: spt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spt
      POSTGRES_PASSWORD: spt
      POSTGRES_DB: spt
    ports:
      - "5432:5432"
    volumes:
      - spt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spt-pgdata:
